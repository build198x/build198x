# release-plz configuration.
#
# Trigger: every push to main runs release-plz, which opens (or updates) a
# "chore: release" PR with a bumped workspace version and a CHANGELOG entry
# generated from the new commits (conventional-commit prefixes drive the
# bump; .github/workflows/pr-title.yml is what keeps them there, since squash
# merge makes the PR title the commit subject). Merging that PR creates a git
# tag, which fires
# .github/workflows/release.yml (cargo-dist) to build the `build198x` CLI and
# attach the archives to a GitHub Release.
#
# Versioning is lockstep: every workspace crate inherits its version from
# [workspace.package] in Cargo.toml, so a single bump applies everywhere.
#
# publish = false is the workspace default, with one deliberate exception:
# mediaspec198x (see its [[package]] block below). Everything else ships as a
# binary via the GitHub Release rather than the registry. Generic crate names
# still aren't claimed on crates.io — which is exactly why the spec crate is
# `mediaspec198x` and not `mediaspec`. git_release_enable = false: cargo-dist
# owns the GitHub Release, not release-plz — release-plz only bumps,
# changelogs, and tags.
[workspace]
publish = false
git_release_enable = false
git_tag_enable = true
changelog_update = true

# git_only is NOT set here, deliberately. It takes the previous version from
# the git tag rather than the crates.io registry, and is required whenever
# publish = false — with no registry baseline release-plz cannot see the last
# release and never bumps (it reports "already up-to-date" and opens no release
# PR). See the umbrella project-skeleton-standard decision.
#
# But release-plz rejects git_only alongside publish = true: "Config options
# 'git_only' and 'publish' are mutually exclusive." As a [workspace] key it
# applies to every package, so it cannot coexist with the two crates below that
# publish. It therefore sits on build198x's own [[package]] block, which is the
# only crate that needs it.

[changelog]
protect_breaking_commits = true
commit_parsers = [
  { message = '^chore(\([^)]*\))?: release\b', skip = true },
  { message = '^(feat|fix|perf|revert)\((ci|release)\)', skip = true },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^revert", group = "Reverted" },
  { message = '^(chore|build)\(deps\)', group = "Dependencies" },
  { message = "^(docs|test|chore|ci|build|refactor|style)", skip = true },
  { message = "^Merge", skip = true },
  { message = ".*", group = "Other" },
]

# Library crates ride the lockstep version and are not tagged, because they
# exist only as dependencies of `build198x` and have nothing to release on
# their own. That is now a preference rather than a requirement: with
# tag-namespace = "build198x" set in Cargo.toml, cargo-dist only answers to
# tags carrying that prefix, so a `<lib>-vX.Y.Z` tag reaches nothing.
#
# Before the namespace existed it was load-bearing. cargo-dist fired on any
# version-shaped tag and errored on a package with no binary, so a library tag
# produced a failed or junk release run — Asm198x's `isa-disasm` did exactly
# that once, cutting a Release containing only a dist-manifest.json which then
# took the "Latest" badge. A library crate added without a block here would
# have reproduced it.
#
# It no longer can. A new library crate needs a block here only if you want it
# left untagged; forgetting one is no longer a way to break a release.

# mediaspec198x: the authored media capability spec (zero-dep library). The one
# crate here that is versioned independently of the workspace's lockstep
# version, and it publishes to crates.io. Four orgs are told to consume it
# (Emu198x, Play198x, Forge198x, Studio198x) and a published consumer cannot
# depend on a git revision, so the registry is the only route that works.
#
# It tags and cuts its own GitHub Release, which the tag namespace above makes
# safe: `mediaspec198x-vX.Y.Z` does not carry the `build198x` prefix, so
# cargo-dist never sees it. Its version baseline is the registry, which
# publish = true gives it.
#
# The release earns its keep. crates.io lists versions and carries no notes, so
# a consumer in another org deciding whether to take the next version had
# nothing to read — and this crate is consumed by four of them.
# build198x: the CLI. Never published — the binary ships via cargo-dist — so it
# has no registry baseline and release-plz would silently never bump it. That is
# what git_only fixes, and it must sit here rather than on [workspace]:
# release-plz rejects git_only alongside publish = true, and the two crates below
# do publish.
[[package]]
name = "build198x"
publish = false
git_only = true

[[package]]
name = "mediaspec198x"
publish = true
git_tag_enable = true
git_release_enable = true

# build198x-adf: the standalone ADF binary (a lean frontend over the library).
# It has a binary, so cargo-dist builds it — from a tag of its own.
#
# It used to ride the CLI's build198x-vX.Y.Z tag, and that silently cost it
# every release artifact it should have had. dist reads a tag as either bare
# `vX.Y.Z`, meaning every dist-able package in the workspace, or
# `{package}-vX.Y.Z`, meaning that package alone. `build198x` is a package, so
# the CLI's tag is the second form and the rest of the workspace is dropped:
# v0.2.3 and v0.2.4 both shipped without adf archives and without adf.rb. See
# issue #34 for the measurements. A tag per package is what the grammar is
# asking for, and the namespace glob already matches it, so no workflow changes.
#
# Two GitHub Releases per version is the price. Versions stay in lockstep —
# every crate inherits [workspace.package].version — so this is independent
# *tagging*, not the independent *versioning* that was considered and rejected
# (that would re-create the cargo-dist/git_only workarounds the ADF library was
# moved to format198x to escape).
#
# Both releases run the homebrew publish job, which commits to
# build198x/homebrew-tap and pushes without rebasing. Two tags landing together
# can therefore have the second push rejected as non-fast-forward. Re-running
# that job takes a fresh checkout and succeeds; it cannot produce a wrong
# formula, only a missing one.
#
# It is also published to crates.io (for `cargo install build198x-adf`) by
# release-plz itself, the same way mediaspec198x is; build198x stays
# publish = false. publish = true gives it a registry baseline too, so unlike
# build198x it has no need of git_only.
[[package]]
name = "build198x-adf"
publish = true
git_tag_enable = true
