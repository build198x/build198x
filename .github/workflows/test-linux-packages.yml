name: Candidate packages

on:
  # Only changes that can alter a package, or the workflow that builds it
  # (umbrella docs/plans/2026-10-19-ci-efficiency.md, A4).
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - 'crates/**'
  # Every merge that touches a package is qualified on main as well.
  push:
    branches:
      - main
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - 'crates/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

concurrency:
  group: candidate-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    name: Verify producer lock (${{ matrix.target }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_PLAN: ${{ inputs.plan }}
      PACKAGE_TARGET: ${{ matrix.target }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned dist (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dist_version=$(awk -F'"' '/^cargo-dist-version/{print $2}' Cargo.toml)
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${dist_version}/cargo-dist-installer.sh" -o "$RUNNER_TEMP/install-dist.sh"
          sh "$RUNNER_TEMP/install-dist.sh"
      - name: Install pinned dist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^cargo-dist-version = "([^"]+)"').Matches.Groups[1].Value
          if (-not $version) { throw 'Missing pinned cargo-dist version' }
          Invoke-WebRequest "https://github.com/axodotdev/cargo-dist/releases/download/v$version/cargo-dist-installer.ps1" -OutFile "$env:RUNNER_TEMP/install-dist.ps1"
          & "$env:RUNNER_TEMP/install-dist.ps1"
      - name: Check regeneration and rejection controls
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_release_workflow.py --check
          python -m unittest discover -s scripts -p test_source_lock.py -v
      - name: Cache Rust artifacts
        if: inputs.plan == ''
        uses: Swatinem/rust-cache@v2
      - name: Build packages for this native runner
        if: inputs.plan == ''
        shell: bash
        run: |
          set -euo pipefail
          python scripts/source_lock.py build "$PACKAGE_TARGET" target/package-test-manifest.json target/distrib -- dist build --artifacts=all --target "$PACKAGE_TARGET" --output-format=json
      - name: Fetch the actual release packages
        if: inputs.plan != ''
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib
          merge-multiple: true
      - name: Save the release plan
        if: inputs.plan != ''
        shell: bash
        run: printf '%s\n' "$RELEASE_PLAN" > target/package-test-manifest.json
      - name: Verify every selected package receipt against actual bytes
        shell: bash
        run: python scripts/source_lock.py verify "$PACKAGE_TARGET" target/package-test-manifest.json target/distrib --output "$RUNNER_TEMP/source-lock-report.json"
      - name: Retain source-lock verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: producer-source-lock-${{ matrix.target }}-${{ github.run_attempt }}
          retention-days: 90
          path: ${{ runner.temp }}/source-lock-report.json
          if-no-files-found: error
      - name: Set up Homebrew
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            curl --proto '=https' --tlsv1.2 -LsSf https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh -o "$RUNNER_TEMP/install-homebrew.sh"
            NONINTERACTIVE=1 /bin/bash "$RUNNER_TEMP/install-homebrew.sh"
          fi
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Install generated formulae and check output
        if: runner.os == 'Linux'
        shell: bash
        run: python3 scripts/test-linux-packages.py target/package-test-manifest.json "$PACKAGE_TARGET"
