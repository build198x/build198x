name: Release-plz

on:
  push:
    branches:
      - main

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  pull-requests: write
  contents: write
  id-token: write # OIDC for crates.io Trusted Publishing — release-plz uses it directly

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # release-plz needs full history to diff the changelog from the
          # last tag.
          fetch-depth: 0
          # The `release` step below pushes the version tag with this token. A
          # tag pushed by GITHUB_TOKEN does NOT trigger other workflows, so the
          # per-org RELEASE_PLZ_TOKEN (a fine-grained PAT) is required for the
          # tag to fire cargo-dist's release.yml.
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      # Two steps, the release-plz two-command model: release-pr opens/updates
      # the "chore: release" PR for new commits; release tags any version in
      # Cargo.toml that isn't yet tagged (i.e. once that PR is merged) and the
      # tag push fires cargo-dist's release.yml.
      - name: Run release-plz (open/update release PR)
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Run release-plz (tag merged releases)
        id: release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      # Announce crates.io publishes in Discord.
      #
      # Separate from the Discord post that release.yml makes: that one covers
      # the binary GitHub Release, which is cargo-dist's. This covers the
      # registry, which is release-plz's — and mediaspec198x has no GitHub
      # Release at all (git_tag_enable = false in release-plz.toml, because a
      # version tag would fire cargo-dist on a library it cannot build), so
      # without this its publishes are announced nowhere.
      #
      # Membership is decided by asking crates.io rather than by listing crate
      # names here, so a crate that starts or stops publishing needs no edit:
      # build198x itself is publish = false and is skipped automatically.
      - name: Announce crates.io publishes in Discord
        if: steps.release.outputs.releases_created == 'true'
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          WEBHOOK_ALL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_ALL }}
          RELEASES: ${{ steps.release.outputs.releases }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Post to this project's own channel and, when set, an aggregate
          # channel carrying every repo. Built with `if` rather than
          # `[ -n "$x" ] && arr+=(...)`: under `set -e` a failing test at the end
          # of a command list exits the step, so the shorter form would abort
          # whenever a secret is unset — the normal case this tolerates.
          targets=()
          if [ -n "${WEBHOOK}" ]; then
            targets+=("$WEBHOOK")
          fi
          # Skip an aggregate pointed at the same channel, so a single-channel
          # setup that fills both secrets does not post twice.
          if [ -n "${WEBHOOK_ALL}" ] && [ "${WEBHOOK_ALL}" != "${WEBHOOK}" ]; then
            targets+=("$WEBHOOK_ALL")
          fi

          if [ ${#targets[@]} -eq 0 ]; then
            echo "::notice::no Discord webhook secret set — nothing posted."
            exit 0
          fi

          published='[]'
          while read -r pkg version; do
            [ -n "$pkg" ] || continue
            if curl -sf -A "198x-ci" \
                 "https://crates.io/api/v1/crates/$pkg/$version" >/dev/null; then
              published=$(jq -c --arg p "$pkg" --arg v "$version" \
                            '. + [{package_name: $p, version: $v}]' <<<"$published")
            else
              echo "$pkg $version is not on crates.io — not a registry publish, skipping."
            fi
          done < <(jq -r '.[] | "\(.package_name) \(.version)"' <<<"$RELEASES")

          count=$(jq 'length' <<<"$published")
          if [ "$count" = "0" ]; then
            echo "::notice::nothing published to crates.io in this run."
            exit 0
          fi

          # One message for the run, a field per crate — same shape as
          # format198x's, which releases several crates per cycle too.
          jq -n \
            --argjson releases "$published" \
            --arg repo "$REPO" \
            --arg title "$( [ "$count" = "1" ] && echo "build198x — 1 crate published to crates.io" || echo "build198x — ${count} crates published to crates.io" )" \
            '{
               username: "198x releases",
               embeds: [{
                 title: $title,
                 url: ("https://crates.io/crates/" + $releases[0].package_name),
                 color: 3447003,
                 fields: ($releases | map({
                   name: (.package_name + " v" + .version),
                   value: ("[crates.io](https://crates.io/crates/" + .package_name + "/" + .version + ")"),
                   inline: false
                 })),
                 footer: { text: $repo }
               }]
             }' > crates-payload.json

          # Every target is attempted even if an earlier one fails, so a stale
          # aggregate URL cannot hide a successful post to the project channel.
          failed=0
          for target in "${targets[@]}"; do
            if ! curl --silent --show-error --fail-with-body \
                      --retry 3 --retry-delay 5 --retry-all-errors \
                      -H "Content-Type: application/json" \
                      -X POST -d @crates-payload.json "$target"; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::at least one Discord post failed; see the output above."
            exit 1
          fi

          echo "Announced ${count} crates.io publish(es) to Discord."
